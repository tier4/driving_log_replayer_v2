ScenarioFormatVersion: 3.0.0
ScenarioName: vehicle_model_reidentify

Evaluation:
  Conditions:
    comparison_models: [baseline, v1, v1_rk4, current]
    models:
      baseline:
        vehicle_model_type: delay_steer_acc_geared_wo_fall_guard
        acceleration_source: accel
        params:
          wheelbase: 4.76012
          acc_time_delay: 0.1
          acc_time_constant: 0.1
          debug_acc_scaling_factor: 1.0
          steer_time_delay: 0.17
          steer_time_constant: 0.15
          debug_steer_scaling_factor: 1.0
          steer_dead_band: 0.0
          steer_bias: 0.0
          steer_rate_lim: 5.0
          k_us: 0.0
          xy_heading_rate_coeff: 0.0

      # 確定済みモデル: 物理妥当性レポートではフィットせず固定評価のみ行う。
      v1:
        vehicle_model_type: delay_steer_acc_geared_for_diffusion_planner
        acceleration_source: kinematic_savgol
        params:
          wheelbase: 4.76012
          acc_time_delay: 0.1
          acc_time_constant: 0.3
          debug_acc_scaling_factor: 1.0
          steer_time_delay: 0.05
          steer_time_constant: 0.15
          debug_steer_scaling_factor: 1.0
          steer_dead_band: 0.0
          steer_bias: 0.0
          steer_rate_lim: 0.6
          k_us: 0.018
          xy_heading_rate_coeff: 0.0

      # 検討中モデル: v1 の RK4 バリエーションとしてフィット診断も表示する。
      v1_rk4:
        vehicle_model_type: delay_steer_acc_geared_for_diffusion_planner
        acceleration_source: kinematic_savgol
        params:
          wheelbase: 4.76012
          acc_time_delay: 0.1
          acc_time_constant: 0.3
          debug_acc_scaling_factor: 1.0
          steer_time_delay: 0.05
          steer_time_constant: 0.15
          debug_steer_scaling_factor: 1.0
          steer_dead_band: 0.0
          steer_bias: 0.0
          steer_rate_lim: 0.6
          k_us: 0.018
          xy_heading_rate_coeff: 0.0
          use_rk4: true

      current:
        vehicle_model_type: delay_steer_acc_geared_for_diffusion_planner
        acceleration_source: kinematic_savgol
        params:
          wheelbase: 4.76012
          acc_time_delay: 0.1
          acc_time_constant: 0.3
          debug_acc_scaling_factor: 1.0
          steer_time_delay: 0.05
          steer_time_constant: 0.15
          debug_steer_scaling_factor: 1.0
          steer_dead_band: 0.0
          steer_bias: 0.0
          steer_rate_lim: 0.6
          k_us: 0.018
          xy_heading_rate_coeff: 0.0
