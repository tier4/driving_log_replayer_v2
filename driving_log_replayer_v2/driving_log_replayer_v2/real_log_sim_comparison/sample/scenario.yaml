ScenarioFormatVersion: 3.0.0
ScenarioName: vehicle_model_reidentify

Evaluation:
  Conditions:
    comparison_models: [baseline, v1, v1_rk4, v1_c, v2, current]
    # release ステージの出力先: v2 ケースを simulator_model.param.yaml の v2 スロットへ
    # リリースする (tuned の v100 は含めない)。未指定時は従来どおり tuned → v100。
    release: {model: v2, version: 2}
    # レポート 9 章 (時系列診断) の対象 dataset-id のリスト。指定すると release ケース
    # (未指定時は tuned) のパラメータで状態方程式の左辺・右辺・指令値を各データセットに
    # ついて時系列描画する。省略時は案内のみ。
    plot_dataset:
      - 0a246ffe-e8a6-5027-94f6-b860ecdda887
      - 2f9f3f24-dd96-5681-80ed-5fbc953df4a9
      - 3b6b940c-c58f-5475-b5a0-4f1958568a0a

    models:
      baseline:
        vehicle_model_type: delay_steer_acc_geared_wo_fall_guard
        acceleration_source: accel
        params:
          wheelbase: 4.76012
          acc_time_delay: 0.1
          acc_time_constant: 0.1
          debug_acc_scaling_factor: 1.0
          steer_time_delay: 0.17
          steer_time_constant: 0.15
          debug_steer_scaling_factor: 1.0
          steer_dead_band: 0.0
          steer_bias: 0.0
          steer_rate_lim: 5.0
          k_us: 0.0
          xy_heading_rate_coeff: 0.0

      # 確定済みモデル: 物理妥当性レポートではフィットせず固定評価のみ行う。
      # v1 のリリース時評価は raw /localization/acceleration 基準のため accel を使う。
      v1:
        vehicle_model_type: delay_steer_acc_geared_for_diffusion_planner
        acceleration_source: accel
        params:
          wheelbase: 4.76012
          acc_time_delay: 0.1
          acc_time_constant: 0.3
          debug_acc_scaling_factor: 1.0
          steer_time_delay: 0.05
          steer_time_constant: 0.15
          debug_steer_scaling_factor: 1.0
          steer_dead_band: 0.0
          steer_bias: 0.0
          steer_rate_lim: 0.6
          k_us: 0.018
          xy_heading_rate_coeff: 0.0

      # 検討中モデル: v1 の RK4 バリエーションとしてフィット診断も表示する。
      v1_rk4:
        vehicle_model_type: delay_steer_acc_geared_for_diffusion_planner
        acceleration_source: kinematic_savgol
        params:
          wheelbase: 4.76012
          acc_time_delay: 0.1
          acc_time_constant: 0.3
          debug_acc_scaling_factor: 1.0
          steer_time_delay: 0.05
          steer_time_constant: 0.15
          debug_steer_scaling_factor: 1.0
          steer_dead_band: 0.0
          steer_bias: 0.0
          steer_rate_lim: 0.6
          k_us: 0.018
          xy_heading_rate_coeff: 0.0
          use_rk4: true

      # 検討中モデル: v1 に xy_heading_rate_coeff の直接同定値のみを追加した ablation。
      # reidentify/fit_xy.py で 372 dataset (n=2,479,500) から同定した値 (2026-07-15)。
      v1_c:
        vehicle_model_type: delay_steer_acc_geared_for_diffusion_planner
        acceleration_source: kinematic_savgol
        params:
          wheelbase: 4.76012
          acc_time_delay: 0.1
          acc_time_constant: 0.3
          debug_acc_scaling_factor: 1.0
          steer_time_delay: 0.05
          steer_time_constant: 0.15
          debug_steer_scaling_factor: 1.0
          steer_dead_band: 0.0
          steer_bias: 0.0
          steer_rate_lim: 0.6
          k_us: 0.018
          xy_heading_rate_coeff: 0.004278

      # リリース候補 v2 (旧 v1_p): v1 にプラトー直接同定の定常補正を追加し、GT を SG 系
      # (steer_savgol + kinematic_savgol、旧 v1_sg を統合) で評価する。
      # 補正値は reidentify/fit_plateau.py が steer/ax の N=30 プラトー RMSE から
      # 318 dataset で同定 (2026-07-16, SG 系 GT 基準)。時定数・むだ時間は v1 のまま固定。
      # debug_acc_scaling_factor は探索下限 0.9 にクランプ (校正域を超える補正要求のサイン)。
      # 全指標で v1 を上回ることを確認済み (steer@300 0.393deg / ax 0.237 / yaw 5.74deg /
      # long 431cm / lat 117cm)。上記 release 指定により v2 としてリリースされる。
      v2:
        vehicle_model_type: delay_steer_acc_geared_for_diffusion_planner
        acceleration_source: kinematic_savgol
        steering_source: steer_savgol
        params:
          wheelbase: 4.76012
          acc_time_delay: 0.1
          acc_time_constant: 0.3
          debug_acc_scaling_factor: 0.9
          steer_time_delay: 0.05
          steer_time_constant: 0.15
          debug_steer_scaling_factor: 1.015827
          steer_dead_band: 0.0
          steer_bias: 0.0
          steer_rate_lim: 0.6
          k_us: 0.018
          xy_heading_rate_coeff: 0.0

      current:
        vehicle_model_type: delay_steer_acc_geared_for_diffusion_planner
        acceleration_source: kinematic_savgol
        params:
          wheelbase: 4.76012
          acc_time_delay: 0.1
          acc_time_constant: 0.3
          debug_acc_scaling_factor: 1.0
          steer_time_delay: 0.05
          steer_time_constant: 0.15
          debug_steer_scaling_factor: 1.0
          steer_dead_band: 0.0
          steer_bias: 0.0
          steer_rate_lim: 0.6
          k_us: 0.018
          xy_heading_rate_coeff: 0.0
