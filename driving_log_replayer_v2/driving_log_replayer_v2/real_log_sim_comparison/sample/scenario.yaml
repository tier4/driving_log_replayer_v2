ScenarioFormatVersion: 3.0.0
ScenarioName: vehicle_model_reidentify

Evaluation:
  Conditions:
#    comparison_models: [baseline, v1, v2, v2_rk4, v2_c, v2_t, v3_slope, current]
    comparison_models: [baseline, v1, v2, v3]
    # ---- GT フレーム (審判の定義、2026-07-17 再設計) ----
    # localization_consistent: pose を真値アンカーとし、観測モデル同定値 (report 9 章:
    # twist vx の実効遅延 +93 ms / スケール +0.4% 過大、R²=0.74) で twist を pose と
    # 運動学整合させる (vx を前進 + ×0.996。pose は指令→応答チェーンと整合済みのため無補正)。
    # raw フレームでは「ax/vx (twist 系) は減速を弱めろ / long (pose 系) は強めろ」という
    # 矛盾要求が生じ、縦系の構造改善 (brake 分離・bite 等) が全て採用ゲートで棄却された。
    observation_frame: localization_consistent
    # fit 対象ケースと実行ステージ。target は同定の初期値/対象ケース (既定 current)。
    # stages は lon->steer->xy の連続する先頭部分 + 任意で merge。省略時は全ステージ、
    # [] で fit を行わず固定比較のみ。fit 出力 "tuned" を比較表・グラフに載せたい場合は
    # fit 対象 (current) を comparison_models に明記する (未指定なら比較には出ない)。
    # release: {model: tuned, ...} なら比較への明記なしでもリリースは可能。
    # freeze: v3 候補の再構築 (2026-07-17) は「v2 と同じ基本構造」で行う — 構造項
    # (drag / brake 分割 / bite / 緩和長) はセンチネル 0 に凍結し関節探索から除外する。
    # 構造項は新審判での基本構造ベースライン確定後に単独 ablation で再判定する。
    # 注: 8 次元関節 TPE (160 trials) の score 最適点はセル別ゲートと乖離する
    # (steer/ax mean +15〜25% で FAIL) ため、v3 は gate screen による少数次元スイープで
    # 確定した (v2 の k_us / 旧 L_rel と同じ方法論)。fit はスイープ完了につき無効化。
    fit:
      target: current
      stages: []
      freeze:
        - lon_drag_c0
        - lon_drag_c2
        - brake_time_constant
        - brake_scaling_factor
        - brake_bite_gain
        - brake_bite_time_constant
        - steer_relaxation_length
    # release ステージの出力先: v2 ケースを simulator_model.param.yaml の v2 スロットへ
    # リリースする。model には scenario ケース名か fit 出力 "tuned" を指定。
    # release を省略すると release ステージ (YAML 出力) はスキップされる。
    # 注: 旧 v3 (L_rel=0.2) は 2026-07-17 に一度リリース後、score −1.2% と同等性能のため
    # 撤回。その後 GT の pose–twist 不整合 (観測モデル同定で確定) が縦系評価を歪めていた
    # ことが判明し、v3 候補は localization_consistent 審判の下で基本構造から再構築中。
    release: {model: v2, version: 2}
    # レポート 9 章 (時系列診断) の対象 dataset-id のリスト。指定すると release ケース
    # (未指定時は tuned) のパラメータで状態方程式の左辺・右辺・指令値を各データセットに
    # ついて時系列描画する。省略時は案内のみ。
    plot_dataset:
      - 0a246ffe-e8a6-5027-94f6-b860ecdda887
      - 2f9f3f24-dd96-5681-80ed-5fbc953df4a9
      - 3b6b940c-c58f-5475-b5a0-4f1958568a0a

    models:
      # 正規化基準 (robust_score / FLOOR_TABLE の分母)。GT ソースは審判再設計 (2026-07-17)
      # で比較対象と同一系 (kinematic_rts + steer_savgol) に統一 — kinematic_rts は GT 品質
      # 診断 (analysis gt_quality) で kinematic_savgol を積分整合性×ノイズの両軸で支配。
      # 旧評価 (accel 生トピック + 0.08 s シフト基準) の値とは直接比較できない。
      baseline:
        vehicle_model_type: delay_steer_acc_geared_wo_fall_guard
        acceleration_source: kinematic_rts
        steering_source: steer_savgol
        params:
          wheelbase: 4.76012
          acc_time_delay: 0.1
          acc_time_constant: 0.1
          debug_acc_scaling_factor: 1.0
          steer_time_delay: 0.17
          steer_time_constant: 0.15
          debug_steer_scaling_factor: 1.0
          steer_dead_band: 0.0
          steer_bias: 0.0
          steer_rate_lim: 5.0
          k_us: 0.0
          xy_heading_rate_coeff: 0.0

      # 確定済みモデル: 物理妥当性レポートではフィットせず固定評価のみ行う。
      # v1 のリリース時評価は raw /localization/acceleration 基準だったが、比較カーブの
      # GT を揃えるため審判再設計 (2026-07-17) で kinematic_rts + steer_savgol に統一。
      v1:
        vehicle_model_type: delay_steer_acc_geared_for_diffusion_planner
        acceleration_source: kinematic_rts
        steering_source: steer_savgol
        params:
          wheelbase: 4.76012
          acc_time_delay: 0.1
          acc_time_constant: 0.3
          debug_acc_scaling_factor: 1.0
          steer_time_delay: 0.05
          steer_time_constant: 0.15
          debug_steer_scaling_factor: 1.0
          steer_dead_band: 0.0
          steer_bias: 0.0
          steer_rate_lim: 0.6
          k_us: 0.018
          xy_heading_rate_coeff: 0.0

      # リリース候補 v2 (旧 v1_p): v1 にプラトー直接同定の定常補正と k_us 更新を加え、
      # GT を SG 系 (steer_savgol + kinematic_savgol、旧 v1_sg を統合) で評価する。
      # 注: 以下のコメントの robust_score 絶対値 (32.17 / 27.11 / 22.14 / 36.85) は
      # objective v2 (レガシーフロア + worst=max) 当時の値であり、objective v3 の score とは
      # 直接比較できない。
      # 時定数・むだ時間は v1 のまま固定。構成要素は 2 つ:
      # 1) 定常 scaling 補正: reidentify/fit_plateau.py が steer/ax の N=30 プラトー RMSE
      #    から 318 dataset で同定 (2026-07-16, SG 系 GT 基準)。debug_acc_scaling_factor は
      #    探索下限 0.9 にクランプ (校正域を超える補正要求のサイン)。下限 0.8 への拡大検証
      #    (2026-07-16, 318 dataset) でも最適値は 0.800 と新下限に再クランプ (ax@N30
      #    0.199→0.191)。乗算補正の域を超える構造起因の要求と判断し下限 0.9 を維持。
      # 2) k_us 更新 0.018 → 0.012: tuned (fit_merge) の改善要因分解で、v1 から継承した
      #    k_us=0.018 が高速域の yaw/lat worst-case 誤差の主因と判明 (k_us 単独変更で
      #    robust_score 32.17 → 22.14@k_us=0.002)。ただし小さい k_us は短ホライズンの mean
      #    を劣化させるため、318 dataset の 1 次元スイープで「全セル (mean/worst ×
      #    N=10..300 × yaw/long/lat/steer/ax) が k_us=0.018 時点比 +2% 以内」を満たす
      #    最小スコア点 k_us=0.012 (robust_score 27.11, -15.7%) を採用 (2026-07-16)。
      # RK4 / xy_heading_rate_coeff / τ再同定 / acc scaling 下限拡大は v2_rk4 / v2_c / v2_t /
      # 下限 0.8 検証でいずれも全面非劣化を満たさず不採用。
      # 確定値 (318 dataset, 2026-07-16): steer@300 0.393deg / ax 0.237 / yaw 5.70deg /
      # long 430cm / lat 114cm — 全ヘッドライン指標で v1 と k_us 更新前の v2 を上回る。
      # yaw/lat の worst-case は 25〜35% 削減 (lat@150 worst 9.24→6.56, yaw@30 worst
      # 4.02→2.87)。上記 release 指定により v2 としてリリースされる。
      # GT ソースは審判再設計 (2026-07-17) で kinematic_rts に更新 (同定当時は
      # kinematic_savgol)。パラメータはリリース済み v2 のまま。
      v2:
        vehicle_model_type: delay_steer_acc_geared_for_diffusion_planner
        acceleration_source: kinematic_rts
        steering_source: steer_savgol
        params:
          wheelbase: 4.76012
          acc_time_delay: 0.1
          acc_time_constant: 0.3
          debug_acc_scaling_factor: 0.9
          steer_time_delay: 0.05
          steer_time_constant: 0.15
          debug_steer_scaling_factor: 1.015827
          steer_dead_band: 0.0
          steer_bias: 0.0
          steer_rate_lim: 0.6
          k_us: 0.012
          xy_heading_rate_coeff: 0.0

      # 検討中モデル: v2 に RK4 積分のみを追加した ablation (旧 v1_rk4 を v2 ベースへ置換)。
      # GT・パラメータは v2 と同一で use_rk4 だけを立てる。
      v2_rk4:
        vehicle_model_type: delay_steer_acc_geared_for_diffusion_planner
        acceleration_source: kinematic_savgol
        steering_source: steer_savgol
        params:
          wheelbase: 4.76012
          acc_time_delay: 0.1
          acc_time_constant: 0.3
          debug_acc_scaling_factor: 0.9
          steer_time_delay: 0.05
          steer_time_constant: 0.15
          debug_steer_scaling_factor: 1.015827
          steer_dead_band: 0.0
          steer_bias: 0.0
          steer_rate_lim: 0.6
          k_us: 0.012
          xy_heading_rate_coeff: 0.0
          use_rk4: true

      # 検討中モデル: v2 に xy_heading_rate_coeff の直接同定値のみを追加した ablation
      # (旧 v1_c を v2 ベースへ置換)。値は reidentify/fit_xy.py で 372 dataset
      # (n=2,479,500) から同定したもの (2026-07-15)。
      v2_c:
        vehicle_model_type: delay_steer_acc_geared_for_diffusion_planner
        acceleration_source: kinematic_savgol
        steering_source: steer_savgol
        params:
          wheelbase: 4.76012
          acc_time_delay: 0.1
          acc_time_constant: 0.3
          debug_acc_scaling_factor: 0.9
          steer_time_delay: 0.05
          steer_time_constant: 0.15
          debug_steer_scaling_factor: 1.015827
          steer_dead_band: 0.0
          steer_bias: 0.0
          steer_rate_lim: 0.6
          k_us: 0.012
          xy_heading_rate_coeff: 0.004278

      # 検討中モデル: v2 の GT/構成のまま τ・むだ時間を SG 系 GT で再同定した ablation
      # (fit_lon/fit_steer の direct fit + 再同定 τ でのプラトー scaling、2026-07-16 run)。
      # 1-step 残差は改善するが N-step rollout の robust_score は 36.85 と悪化する
      # (v2 は k_us 更新前で 32.17、更新後で 27.11。1-step 直接同定と多段 rollout の
      # ミスマッチ)。採用見送りの記録として残す。
      # steer_time_constant は探索下限 0.05 にクランプ (SG 系 GT では操舵応答が従来想定より
      # 速く見えることを示す)。
      v2_t:
        vehicle_model_type: delay_steer_acc_geared_for_diffusion_planner
        acceleration_source: kinematic_savgol
        steering_source: steer_savgol
        params:
          wheelbase: 4.76012
          acc_time_delay: 0.01
          acc_time_constant: 0.13257939434802885
          debug_acc_scaling_factor: 0.9000560067164145
          steer_time_delay: 0.05
          steer_time_constant: 0.05
          debug_steer_scaling_factor: 1.015805220310957
          steer_dead_band: 0.0
          steer_bias: -0.0006056849379092455
          steer_rate_lim: 0.6
          k_us: 0.018797133899293227
          xy_heading_rate_coeff: 0.0

      # v3 候補 (2026-07-17, localization_consistent 審判): v2 と同じ基本構造のまま
      # 縦系の位相パラメータのみ新審判で再同定した。変更は 2 つ:
      #   acc_time_delay 0.1 → 0.0 / acc_time_constant 0.3 → 0.45
      # 根拠 (gate screen + dense 全セルゲート, v2 基準 mean/cvar +2% 非劣化, 2026-07-17):
      # 1) 旧審判の acc_time_delay 0.1 は twist vx の観測遅延 (+93 ms) を車両むだ時間として
      #    誤同定していた分を含む。整合フレームでは delay=0 が単独で全 35 セル PASS
      #    (dev 全セル平均 −2.55%)。むだ時間を除いた立ち上がりは一次遅れ側で表現され
      #    τ = 0.45 が最適 (0.5 同等、0.6 はセル違反)。
      # 2) 確定値の dense 判定 (2100 セル = mean/cvar × N=1..300 × 7 指標):
      #    all 318 / dev 248 / holdout 70 のすべてで違反 0 セル PASS、
      #    全セル平均 −4.20% (dev −4.12% / holdout −4.38%)。dev score −1.81%。
      # 3) 制約なし 8 次元 TPE (160 trials) の score 最適点はセル別ゲートと乖離
      #    (steer/ax mean +15〜25% で FAIL) — v3 は v2 の k_us と同じ「ゲート拘束スイープ」
      #    で決定した。
      # 見送った近傍候補 (いずれも将来の判断材料として記録):
      #  - steer_time_delay 0.05→0.0 追加: dev score −2.96% まで伸びるが、dense で
      #    N=3〜6 yaw の 4 セルが +2.6〜3.7% 超過 (絶対値 +0.001〜0.0015 deg)。
      #  - steer_time_constant 0.15→0.18: score −5.65% だがセル違反 — テール構造課題
      #    (旧 L_rel と同型)。scaling 0.9 は新審判でも正当 (1.0/0.95 はセル違反)。
      # 旧 v3 候補 (raw 審判での v2 + steer_relaxation_length 0.2) は取り下げ済み —
      # 記録は git 履歴を参照。緩和長構造は新審判ベースラインの確定後に再判定する。
      v3:
        vehicle_model_type: delay_steer_acc_geared_for_diffusion_planner
        acceleration_source: kinematic_rts
        steering_source: steer_savgol
        params:
          wheelbase: 4.76012
          acc_time_delay: 0.0
          acc_time_constant: 0.45
          debug_acc_scaling_factor: 0.9
          steer_time_delay: 0.05
          steer_time_constant: 0.15
          debug_steer_scaling_factor: 1.015827
          steer_dead_band: 0.0
          steer_bias: 0.0
          steer_rate_lim: 0.6
          k_us: 0.012
          xy_heading_rate_coeff: 0.0

      # 検討中モデル (v3 候補 1): v2 + SLOPE_ACCX フィード (slope_source: pitch)。
      # パラメータは v2 と同一で、rollout 入力として +g·sin(pitch_lf) を給電する ablation。
      # 根拠 (2026-07-17 残差分析キャンペーン, analysis.html):
      #   - pitch 符号のコースト回帰: 符号一致率 100% (正 pitch = ノーズ下げ = 下り)
      #   - err_ax@N=30 vs g·sin(pitch_lf): 回帰係数 +0.87 ≈ 1 (dataset 符号一致率 74%)
      #   - 実機経路 (universe simple_planning_simulator は enable_road_slope_simulation: true)
      #     が実勾配を給電しているのに同定は無勾配という系統不整合の解消
      v3_slope:
        vehicle_model_type: delay_steer_acc_geared_for_diffusion_planner
        acceleration_source: kinematic_savgol
        steering_source: steer_savgol
        slope_source: pitch
        params:
          wheelbase: 4.76012
          acc_time_delay: 0.1
          acc_time_constant: 0.3
          debug_acc_scaling_factor: 0.9
          steer_time_delay: 0.05
          steer_time_constant: 0.15
          debug_steer_scaling_factor: 1.015827
          steer_dead_band: 0.0
          steer_bias: 0.0
          steer_rate_lim: 0.6
          k_us: 0.012
          xy_heading_rate_coeff: 0.0

      # 同定対象 (TARGET)。v3 候補の再同定 (2026-07-17): localization_consistent 審判 +
      # kinematic_rts GT の下で、v2 と同じ基本構造 (fit.freeze で構造項を凍結) を
      # lon→steer→xy→merge のフルパイプラインで作り直す。
      # 初期値 = v2 パラメータ (warm start)。素の初期値 (scaling 1.0 / k_us 0.018) からの
      # 160 trials は score 18.52 (v2 18.86 比 −1.8%) に達したがセル別ゲートは全面 FAIL
      # (steer/ax mean +15〜25%) — 目的関数とゲートの乖離のため、v2 近傍からの精密化に切替。
      current:
        vehicle_model_type: delay_steer_acc_geared_for_diffusion_planner
        acceleration_source: kinematic_rts
        steering_source: steer_savgol
        params:
          wheelbase: 4.76012
          acc_time_delay: 0.1
          acc_time_constant: 0.3
          debug_acc_scaling_factor: 0.9
          steer_time_delay: 0.05
          steer_time_constant: 0.15
          debug_steer_scaling_factor: 1.015827
          steer_dead_band: 0.0
          steer_bias: 0.0
          steer_rate_lim: 0.6
          k_us: 0.012
          xy_heading_rate_coeff: 0.0
