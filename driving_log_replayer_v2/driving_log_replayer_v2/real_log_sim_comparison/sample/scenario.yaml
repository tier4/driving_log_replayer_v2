ScenarioFormatVersion: 3.0.0
ScenarioName: vehicle_model_reidentify

Evaluation:
  Conditions:
#    comparison_models: [baseline, v1, v2, v2_rk4, v2_c, v2_t, v3_slope, current]
    comparison_models: [baseline, v1, v2, v3]
    # fit 対象ケースと実行ステージ。target は同定の初期値/対象ケース (既定 current)。
    # stages は lon->steer->xy の連続する先頭部分 + 任意で merge。省略時は全ステージ、
    # [] で fit を行わず固定比較のみ。fit 出力 "tuned" を比較表・グラフに載せたい場合は
    # fit 対象 (current) を comparison_models に明記する (未指定なら比較には出ない)。
    # release: {model: tuned, ...} なら比較への明記なしでもリリースは可能。
    fit: {target: current, stages: [lon, steer, xy, merge]}
    # release ステージの出力先: v2 ケースを simulator_model.param.yaml の v2 スロットへ
    # リリースする。model には scenario ケース名か fit 出力 "tuned" を指定。
    # release を省略すると release ステージ (YAML 出力) はスキップされる。
    # 注: v3 (L_rel=0.2) は 2026-07-17 に一度リリースしたが、厳格ゲートが許す最大値では
    # score −1.2% に留まり N-step 平均カーブ上ほぼ同一のため「同等性能はリリースしない」
    # 判断で撤回。v3 ケースは検討中候補として保持 (下記コメント参照)。
    release: {model: v2, version: 2}
    # レポート 9 章 (時系列診断) の対象 dataset-id のリスト。指定すると release ケース
    # (未指定時は tuned) のパラメータで状態方程式の左辺・右辺・指令値を各データセットに
    # ついて時系列描画する。省略時は案内のみ。
    plot_dataset:
      - 0a246ffe-e8a6-5027-94f6-b860ecdda887
      - 2f9f3f24-dd96-5681-80ed-5fbc953df4a9
      - 3b6b940c-c58f-5475-b5a0-4f1958568a0a

    models:
      baseline:
        vehicle_model_type: delay_steer_acc_geared_wo_fall_guard
        acceleration_source: accel
        params:
          wheelbase: 4.76012
          acc_time_delay: 0.1
          acc_time_constant: 0.1
          debug_acc_scaling_factor: 1.0
          steer_time_delay: 0.17
          steer_time_constant: 0.15
          debug_steer_scaling_factor: 1.0
          steer_dead_band: 0.0
          steer_bias: 0.0
          steer_rate_lim: 5.0
          k_us: 0.0
          xy_heading_rate_coeff: 0.0

      # 確定済みモデル: 物理妥当性レポートではフィットせず固定評価のみ行う。
      # v1 のリリース時評価は raw /localization/acceleration 基準のため accel を使う。
      v1:
        vehicle_model_type: delay_steer_acc_geared_for_diffusion_planner
        acceleration_source: accel
        params:
          wheelbase: 4.76012
          acc_time_delay: 0.1
          acc_time_constant: 0.3
          debug_acc_scaling_factor: 1.0
          steer_time_delay: 0.05
          steer_time_constant: 0.15
          debug_steer_scaling_factor: 1.0
          steer_dead_band: 0.0
          steer_bias: 0.0
          steer_rate_lim: 0.6
          k_us: 0.018
          xy_heading_rate_coeff: 0.0

      # リリース候補 v2 (旧 v1_p): v1 にプラトー直接同定の定常補正と k_us 更新を加え、
      # GT を SG 系 (steer_savgol + kinematic_savgol、旧 v1_sg を統合) で評価する。
      # 注: 以下のコメントの robust_score 絶対値 (32.17 / 27.11 / 22.14 / 36.85) は
      # objective v2 (レガシーフロア + worst=max) 当時の値であり、objective v3 の score とは
      # 直接比較できない。
      # 時定数・むだ時間は v1 のまま固定。構成要素は 2 つ:
      # 1) 定常 scaling 補正: reidentify/fit_plateau.py が steer/ax の N=30 プラトー RMSE
      #    から 318 dataset で同定 (2026-07-16, SG 系 GT 基準)。debug_acc_scaling_factor は
      #    探索下限 0.9 にクランプ (校正域を超える補正要求のサイン)。下限 0.8 への拡大検証
      #    (2026-07-16, 318 dataset) でも最適値は 0.800 と新下限に再クランプ (ax@N30
      #    0.199→0.191)。乗算補正の域を超える構造起因の要求と判断し下限 0.9 を維持。
      # 2) k_us 更新 0.018 → 0.012: tuned (fit_merge) の改善要因分解で、v1 から継承した
      #    k_us=0.018 が高速域の yaw/lat worst-case 誤差の主因と判明 (k_us 単独変更で
      #    robust_score 32.17 → 22.14@k_us=0.002)。ただし小さい k_us は短ホライズンの mean
      #    を劣化させるため、318 dataset の 1 次元スイープで「全セル (mean/worst ×
      #    N=10..300 × yaw/long/lat/steer/ax) が k_us=0.018 時点比 +2% 以内」を満たす
      #    最小スコア点 k_us=0.012 (robust_score 27.11, -15.7%) を採用 (2026-07-16)。
      # RK4 / xy_heading_rate_coeff / τ再同定 / acc scaling 下限拡大は v2_rk4 / v2_c / v2_t /
      # 下限 0.8 検証でいずれも全面非劣化を満たさず不採用。
      # 確定値 (318 dataset, 2026-07-16): steer@300 0.393deg / ax 0.237 / yaw 5.70deg /
      # long 430cm / lat 114cm — 全ヘッドライン指標で v1 と k_us 更新前の v2 を上回る。
      # yaw/lat の worst-case は 25〜35% 削減 (lat@150 worst 9.24→6.56, yaw@30 worst
      # 4.02→2.87)。上記 release 指定により v2 としてリリースされる。
      v2:
        vehicle_model_type: delay_steer_acc_geared_for_diffusion_planner
        acceleration_source: kinematic_savgol
        steering_source: steer_savgol
        params:
          wheelbase: 4.76012
          acc_time_delay: 0.1
          acc_time_constant: 0.3
          debug_acc_scaling_factor: 0.9
          steer_time_delay: 0.05
          steer_time_constant: 0.15
          debug_steer_scaling_factor: 1.015827
          steer_dead_band: 0.0
          steer_bias: 0.0
          steer_rate_lim: 0.6
          k_us: 0.012
          xy_heading_rate_coeff: 0.0

      # 検討中モデル: v2 に RK4 積分のみを追加した ablation (旧 v1_rk4 を v2 ベースへ置換)。
      # GT・パラメータは v2 と同一で use_rk4 だけを立てる。
      v2_rk4:
        vehicle_model_type: delay_steer_acc_geared_for_diffusion_planner
        acceleration_source: kinematic_savgol
        steering_source: steer_savgol
        params:
          wheelbase: 4.76012
          acc_time_delay: 0.1
          acc_time_constant: 0.3
          debug_acc_scaling_factor: 0.9
          steer_time_delay: 0.05
          steer_time_constant: 0.15
          debug_steer_scaling_factor: 1.015827
          steer_dead_band: 0.0
          steer_bias: 0.0
          steer_rate_lim: 0.6
          k_us: 0.012
          xy_heading_rate_coeff: 0.0
          use_rk4: true

      # 検討中モデル: v2 に xy_heading_rate_coeff の直接同定値のみを追加した ablation
      # (旧 v1_c を v2 ベースへ置換)。値は reidentify/fit_xy.py で 372 dataset
      # (n=2,479,500) から同定したもの (2026-07-15)。
      v2_c:
        vehicle_model_type: delay_steer_acc_geared_for_diffusion_planner
        acceleration_source: kinematic_savgol
        steering_source: steer_savgol
        params:
          wheelbase: 4.76012
          acc_time_delay: 0.1
          acc_time_constant: 0.3
          debug_acc_scaling_factor: 0.9
          steer_time_delay: 0.05
          steer_time_constant: 0.15
          debug_steer_scaling_factor: 1.015827
          steer_dead_band: 0.0
          steer_bias: 0.0
          steer_rate_lim: 0.6
          k_us: 0.012
          xy_heading_rate_coeff: 0.004278

      # 検討中モデル: v2 の GT/構成のまま τ・むだ時間を SG 系 GT で再同定した ablation
      # (fit_lon/fit_steer の direct fit + 再同定 τ でのプラトー scaling、2026-07-16 run)。
      # 1-step 残差は改善するが N-step rollout の robust_score は 36.85 と悪化する
      # (v2 は k_us 更新前で 32.17、更新後で 27.11。1-step 直接同定と多段 rollout の
      # ミスマッチ)。採用見送りの記録として残す。
      # steer_time_constant は探索下限 0.05 にクランプ (SG 系 GT では操舵応答が従来想定より
      # 速く見えることを示す)。
      v2_t:
        vehicle_model_type: delay_steer_acc_geared_for_diffusion_planner
        acceleration_source: kinematic_savgol
        steering_source: steer_savgol
        params:
          wheelbase: 4.76012
          acc_time_delay: 0.01
          acc_time_constant: 0.13257939434802885
          debug_acc_scaling_factor: 0.9000560067164145
          steer_time_delay: 0.05
          steer_time_constant: 0.05
          debug_steer_scaling_factor: 1.015805220310957
          steer_dead_band: 0.0
          steer_bias: -0.0006056849379092455
          steer_rate_lim: 0.6
          k_us: 0.018797133899293227
          xy_heading_rate_coeff: 0.0

      # 検討中モデル v3 (リリース撤回 2026-07-17): v2 + 実効ステア (タイヤ緩和長 0.2 m)。
      # dense 全セル非劣化ゲート (2100 セル) を violation 0 で通過するが、score −1.2% と
      # N-step 平均カーブ上ほぼ同一のためリリース見送り (同等性能はリリースしない方針)。
      # L_rel=0.6 なら score −5.35% (yaw@30 mean −4.6%) だが CVaR テール 4 セルが超過 —
      # テールゲート/目的関数の再設計か、テール (高 ay) に効く追加構造とのセットで再挑戦する。
      # ヨー式が使うステアを τ_rel = L_rel / max(v, 1) の一次遅れでなます (速度依存ラグ)。
      # 根拠 (2026-07-17 残差分析キャンペーン + gate スイープ, analysis.html / gate.py):
      # 1) 構造要求: 計測ステア (SG) の実効ラグ ≈117ms に対しヨー応答は ≈200ms 相当。
      #    steer τ 短縮単独は N-step 全面悪化 (τ=0.10 で yaw@10 +15% / τ=0.05 で +36%) し、
      #    「ステア角センサ応答」と「ヨーを生む実効ステア (タイヤ横力の緩和)」の分離が必要。
      # 2) L_rel 1 次元スイープ (v2 比、全セル mean/cvar +2% 非劣化ゲート):
      #    L=0.6 で robust_score −5.35% だが yaw/lat の CVaR テール 4 セルが超過。
      #    L=0.25 は dev PASS / 全 318 で 1 セル (+2.03%) 超過。
      #    L=0.2 が「全セル非劣化 (dev 248 PASS / 全 318 PASS) を満たす最大値」で
      #    robust_score −1.2% (yaw@30 mean ≈ −4%)。holdout 64 は yaw@30 cvar +2.8% の
      #    1 セルのみ (テール 7 本の統計ノイズ範囲) — v2 の k_us スイープと同じ方法論。
      # 3) τ_rel ∝ 1/v は err_lat の速度依存 (効果量 17%)・CVaR テール=高 ay とも整合。
      # 縦系 (slope 給電 / brake 分割 / drag) は単独・関節探索とも CVaR テールとトレードし
      # ゲート不通過 (2026-07-17 記録)。v3.1 以降の候補として analysis 成果物に保持。
      v3:
        vehicle_model_type: delay_steer_acc_geared_for_diffusion_planner
        acceleration_source: kinematic_savgol
        steering_source: steer_savgol
        params:
          wheelbase: 4.76012
          acc_time_delay: 0.1
          acc_time_constant: 0.3
          debug_acc_scaling_factor: 0.9
          steer_time_delay: 0.05
          steer_time_constant: 0.15
          debug_steer_scaling_factor: 1.015827
          steer_dead_band: 0.0
          steer_bias: 0.0
          steer_rate_lim: 0.6
          k_us: 0.012
          xy_heading_rate_coeff: 0.0
          lon_drag_c0: 0.0
          lon_drag_c2: 0.0
          brake_time_constant: 0.0
          brake_scaling_factor: 0.0
          steer_relaxation_length: 0.2

      # 検討中モデル (v3 候補 1): v2 + SLOPE_ACCX フィード (slope_source: pitch)。
      # パラメータは v2 と同一で、rollout 入力として +g·sin(pitch_lf) を給電する ablation。
      # 根拠 (2026-07-17 残差分析キャンペーン, analysis.html):
      #   - pitch 符号のコースト回帰: 符号一致率 100% (正 pitch = ノーズ下げ = 下り)
      #   - err_ax@N=30 vs g·sin(pitch_lf): 回帰係数 +0.87 ≈ 1 (dataset 符号一致率 74%)
      #   - 実機経路 (universe simple_planning_simulator は enable_road_slope_simulation: true)
      #     が実勾配を給電しているのに同定は無勾配という系統不整合の解消
      v3_slope:
        vehicle_model_type: delay_steer_acc_geared_for_diffusion_planner
        acceleration_source: kinematic_savgol
        steering_source: steer_savgol
        slope_source: pitch
        params:
          wheelbase: 4.76012
          acc_time_delay: 0.1
          acc_time_constant: 0.3
          debug_acc_scaling_factor: 0.9
          steer_time_delay: 0.05
          steer_time_constant: 0.15
          debug_steer_scaling_factor: 1.015827
          steer_dead_band: 0.0
          steer_bias: 0.0
          steer_rate_lim: 0.6
          k_us: 0.012
          xy_heading_rate_coeff: 0.0

      # 同定対象 (TARGET)。GT はリリース基準の v2 と同じ SG 系
      # (kinematic_savgol + steer_savgol) に揃える。
      current:
        vehicle_model_type: delay_steer_acc_geared_for_diffusion_planner
        acceleration_source: kinematic_savgol
        steering_source: steer_savgol
        params:
          wheelbase: 4.76012
          acc_time_delay: 0.1
          acc_time_constant: 0.3
          debug_acc_scaling_factor: 1.0
          steer_time_delay: 0.05
          steer_time_constant: 0.15
          debug_steer_scaling_factor: 1.0
          steer_dead_band: 0.0
          steer_bias: 0.0
          steer_rate_lim: 0.6
          k_us: 0.018
          xy_heading_rate_coeff: 0.0
