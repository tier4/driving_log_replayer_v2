name: deploy-document

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  deploy-document:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to gh-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.10"
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4.3.0
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install mkdocs-material mkdocs-awesome-pages-plugin mkdocs-static-i18n mdx_truly_sane_lists
      - name: Deploy document
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"
          mkdocs gh-deploy --force
