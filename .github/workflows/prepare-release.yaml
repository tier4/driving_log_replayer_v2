name: prepare-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g. 3.18.18)
        required: true
        type: string

permissions: {}

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version
        run: |
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid version: ${VERSION}" >&2
            exit 1
          fi
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2.1.4
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout develop
        uses: actions/checkout@v5.1.0
        with:
          ref: develop
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.10"
      - run: pip install catkin_pkg
      - name: Prepare release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "chore/prepare-release-${VERSION}"
          # update CHANGELOG.rst and package.xml, and create a release commit and a local tag
          catkin_generate_changelog
          git add -A
          git commit -m "chore: update changelog for ${VERSION}"
          catkin_prepare_release --version "${VERSION}" --no-push -y
          # the signed tag is created manually after merge, so drop the local tag
          git tag -d "${VERSION}"
          # keep pyproject.toml and uv.lock in sync with package.xml
          sed -i "0,/^version = \".*\"/s//version = \"${VERSION}\"/" pyproject.toml
          python - <<'EOF'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          lock = Path("uv.lock")
          text = lock.read_text()
          text = re.sub(
              r'(name = "driving-log-replayer-v2"\nversion = )"[^"]*"',
              rf'\1"{version}"',
              text,
              count=1,
          )
          lock.write_text(text)
          EOF
          git add pyproject.toml uv.lock
          git commit -m "chore: bump version in pyproject.toml to ${VERSION}"
          git push origin "chore/prepare-release-${VERSION}"
      - name: Create pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr create \
            --base develop \
            --head "chore/prepare-release-${VERSION}" \
            --title "chore: release ${VERSION}" \
            --body "Prepare release ${VERSION}.

          - [ ] Review CHANGELOG.rst
          - [ ] Add the ${VERSION} entry to ReleaseNotes.md
          - [ ] After merge, a develop -> main pull request is created automatically"
