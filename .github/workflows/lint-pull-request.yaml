name: lint-pull-request

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] no checkout or untrusted code execution
    types:
      - opened
      - edited
      - synchronize

permissions: {}

jobs:
  lint-pull-request:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
