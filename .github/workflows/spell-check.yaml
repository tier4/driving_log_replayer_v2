name: spell-check

on:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  spell-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Inlined from autowarefoundation/autoware-github-actions/spell-check
      # because it uses streetsidesoftware/cspell-action@v9, which is not pinned to a commit SHA.
      - name: Install dict packages
        # The dictionaries intentionally track upstream, same as autoware-github-actions/spell-check.
        run: | # zizmor: ignore[adhoc-packages]
          npm install https://github.com/autowarefoundation/autoware-spell-check-dict
          npm install https://github.com/tier4/cspell-dicts
      - name: Retrieve remote dictionary
        run: curl -fsSL -o remote.cspell.json https://raw.githubusercontent.com/tier4/autoware-spell-check-dict/main/.cspell.json
      - name: Create combined dictionary
        run: |
          cp repository.cspell.json local.cspell.json
          echo '{ "import": ["./remote.cspell.json", "./local.cspell.json"] }' > .cspell.json
      - name: Run spell-check
        uses: streetsidesoftware/cspell-action@ce1816e4ce36532956ac6e983737392774b6e169 # v9.2.0
        with:
          config: .cspell.json
          incremental_files_only: false
