name: pre-commit

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions: {}

jobs:
  pre-commit:
    # run on the "run-ci" label for pull requests created by GITHUB_TOKEN, which do not trigger workflows
    if: github.event.action != 'labeled' || github.event.label.name == 'run-ci'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.1.0
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.10"
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
